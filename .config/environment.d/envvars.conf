# Environment variables for the systemd user session (read by GNOME/Wayland).
# Replaces the deprecated ~/.pam_environment, which pam_env stopped reading in
# Linux-PAM 1.5.0 (2020).

# Prevent gnome-session from starting its own ssh-agent so a user-managed agent
# (e.g. gpg-agent) can provide SSH_AUTH_SOCK instead.
GSM_SKIP_SSH_AGENT_WORKAROUND=1
